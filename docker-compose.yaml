version: '3.5'

services:
  db_bten:
    image: postgres:14.3
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DATABASE}
    container_name: ${POSTGRES_DB_CONTAINER_NAME}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    networks:
      - ${NETWORK}

  app_bten:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${B-Ten-Back}
    # environment:
    #   - PORT=${PORT}
    ports:
      - '3010:3000'
    depends_on:
      - db_bten
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules  # Monta node_modules como volumen
    networks:
      - ${NETWORK}

  minio_bten:
    image: minio/minio
    container_name: ${MINIO_CONTAINER_NAME}
    ports:
      - "9070:9000"  # Mapear el puerto 9050 en el host al puerto 9000 en el contenedor para la API S3
      - "9007:9005"  # Puerto 9005 para la consola MinIO
    volumes:
      - "/mnt/data:/data"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data/${MINIO_BUCKET} --console-address ":9005"
    restart: unless-stopped
    networks:
      - ${NETWORK}

  # minio:
